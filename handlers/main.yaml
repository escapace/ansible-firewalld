---
- name: firewalld validate final configuration
  listen:
    - firewalld reload
    - firewalld apply ipv4 sysctls
    - firewalld apply ipv6 sysctls

  ansible.builtin.include_tasks: "{{ role_path }}/tasks/validate.yaml"
- name: firewalld gather fresh service facts
  listen:
    - firewalld reload
    - firewalld apply ipv4 sysctls
    - firewalld apply ipv6 sysctls

  ansible.builtin.service_facts:
- name: firewalld apply notified ipv4 sysctls on an active host
  listen: firewalld apply ipv4 sysctls

  ansible.builtin.include_tasks: "{{ role_path }}/tasks/apply-sysctls.yaml"
  vars:
    firewalld_sysctl_family: ipv4
  when:
    - not ansible_check_mode
    - (ansible_facts.services | default({})).get('firewalld.service', {}).get('state') == 'running'
- name: firewalld apply notified ipv6 sysctls on an active host
  listen: firewalld apply ipv6 sysctls

  ansible.builtin.include_tasks: "{{ role_path }}/tasks/apply-sysctls.yaml"
  vars:
    firewalld_sysctl_family: ipv6
  when:
    - not ansible_check_mode
    - (ansible_facts.services | default({})).get('firewalld.service', {}).get('state') == 'running'
# The CLI returns the operation result; the packaged systemd reload only signals.
- name: firewalld reload active service synchronously
  listen: firewalld reload
  ansible.builtin.command:
    argv: [firewall-cmd, --reload]
  changed_when: true
  when:
    - not ansible_check_mode
    - (ansible_facts.services | default({})).get('firewalld.service', {}).get('state') == 'running'
