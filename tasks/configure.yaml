---
- name: allocate candidate workspace outside watched directories
  ansible.builtin.tempfile:
    state: directory
    prefix: ansible-firewalld-
  register: firewalld_workspace
  changed_when: false

  check_mode: false
- name: assemble and publish configuration
  block:
    - name: create candidate root
      ansible.builtin.file:
        path: "{{ firewalld_workspace.path }}/firewalld"
        state: directory
        mode: "0700"
      changed_when: false

      check_mode: false
    - name: preserve existing local objects in the candidate
      ansible.builtin.command:
        argv:
          - cp
          - --archive
          - /etc/firewalld/.
          - "{{ firewalld_workspace.path }}/firewalld/"
      changed_when: false

      check_mode: false
    - name: ensure candidate zone directory exists
      ansible.builtin.file:
        path: "{{ firewalld_workspace.path }}/firewalld/zones"
        state: directory
        mode: "0755"
      changed_when: false

      check_mode: false
    - name: inspect owned destinations without following links
      ansible.builtin.stat:
        path: "{{ item.path }}"
        follow: false
      register: firewalld_previous

      loop: "{{ firewalld_owned_files }}"
    - name: reject nonregular owned destinations
      ansible.builtin.assert:
        that: not item.stat.exists or (item.stat.isreg | default(false))
        fail_msg: "refusing nonregular owned destination {{ item.item.path }}"
      loop: "{{ firewalld_previous.results }}"
      loop_control:
        label: "{{ item.item.path }}"

    - name: snapshot existing owned files for publication recovery
      ansible.builtin.command:
        argv:
          - cp
          - --archive
          - "{{ item.item.path }}"
          - "{{ firewalld_workspace.path }}/backup-{{ item.item.template }}"
      changed_when: false

      check_mode: false
      loop: "{{ firewalld_previous.results }}"
      loop_control:
        label: "{{ item.item.path }}"
      when: item.stat.exists
    - name: render only the owned candidate files
      ansible.builtin.template:
        src: "{{ item.template }}"
        dest: "{{ firewalld_workspace.path }}/{{ item.candidate }}"
        owner: root
        group: root
        mode: "0644"
      changed_when: false

      check_mode: false
      loop: "{{ firewalld_owned_files }}"
    - name: validate assembled candidate before publication
      ansible.builtin.include_tasks: validate.yaml
      vars:
        firewalld_validation_root: "{{ firewalld_workspace.path }}/firewalld"

    - name: publish recoverable individual files
      block:
        - name: atomically publish validated configuration
          ansible.builtin.copy:
            remote_src: true
            src: "{{ firewalld_workspace.path }}/{{ item.candidate }}"
            dest: "{{ item.path }}"
            owner: root
            group: root
            mode: "0644"
          register: firewalld_publication
          loop: "{{ firewalld_owned_files }}"
      rescue:
        - name: restore preexisting owned files
          ansible.builtin.copy:
            remote_src: true
            src: "{{ firewalld_workspace.path }}/backup-{{ item.item.template }}"
            dest: "{{ item.item.path }}"
            owner: "{{ item.stat.uid }}"
            group: "{{ item.stat.gid }}"
            mode: "{{ item.stat.mode }}"
          loop: "{{ firewalld_previous.results }}"
          loop_control:
            label: "{{ item.item.path }}"
          when:
            - not ansible_check_mode
            - item.stat.exists

        - name: remove newly published files on failure
          ansible.builtin.file:
            path: "{{ item.item.path }}"
            state: absent
          loop: "{{ firewalld_previous.results }}"
          loop_control:
            label: "{{ item.item.path }}"
          when:
            - not ansible_check_mode
            - not item.stat.exists

        - name: report publication failure after recovery
          ansible.builtin.fail:
            msg: "publication failed; previous owned files restored: {{ ansible_failed_result }}"

    # Notify only after the entire publication succeeded, not while rolling back.
    - name: notify changed persistent inputs
      ansible.builtin.debug:
        msg: "published {{ item.item.path }}"
      changed_when: true
      loop: "{{ firewalld_publication.results }}"
      loop_control:
        label: "{{ item.item.path }}"
      when:
        - item.changed
        - not ansible_check_mode
      notify: "{{ item.item.topic }}"
  always:
    - name: remove candidate and recovery workspace
      ansible.builtin.file:
        path: "{{ firewalld_workspace.path }}"
        state: absent
      changed_when: false
      check_mode: false
