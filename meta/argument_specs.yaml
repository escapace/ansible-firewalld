---
argument_specs:
  main:
    short_description: prepare a persistent el10 host firewall
    options:
      firewalld_default_zone_target:
        description: default public zone disposition for otherwise unmatched traffic
        type: str
        default: DROP
        choices: [DROP, REJECT]
      firewalld_strict_forward_ports:
        description: require firewalld authorization for externally created dnat publications
        type: bool
        default: false
      firewalld_ipv6_rpfilter:
        description: ipv6 reverse path filtering mode
        type: str
        default: loose
        choices: [strict, loose, strict-forward, loose-forward, "no"]
